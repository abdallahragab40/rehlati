name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # اختبارات الشبكة (المصادر الحقيقية للقرآن) بتتعدّى هنا — dart_test.yaml
      - run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter build apk --debug

  # بيتأكد إن نسخة iOS بتتبني (release من غير توقيع). مش بديل عن البناء الموقّع
  # (flutter build ipa) ولا عن التجربة على جهاز — دول في docs/RELEASE.md.
  ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
